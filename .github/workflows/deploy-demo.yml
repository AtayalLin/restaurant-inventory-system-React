# 線上 Demo：main 有更新時，建置 Demo 版並部署到 GitHub Pages
# Demo 版用 MSW 在瀏覽器裡模擬後端與 AI，不需要伺服器，也不含任何 API 金鑰
#
# 第一次使用前：GitHub repo → Settings → Pages → Build and deployment → Source 選「GitHub Actions」
name: Deploy Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只跑一個部署，新的 push 進來就取消還在排隊的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:demo

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
