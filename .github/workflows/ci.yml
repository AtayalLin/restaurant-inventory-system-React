# 持續整合：每次 push 或開 Pull Request，自動檢查程式碼能不能通過 lint、型別檢查與建置
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci：完全依照 package-lock.json 安裝，確保跟本機是同一組套件版本
      - run: npm ci

      - name: ESLint
        run: npm run lint

      # 單元／整合測試：計算邏輯、出餐扣庫存、樂觀鎖（以 MSW 模擬後端）
      - name: 測試
        run: npm test

      # build 內含 tsc -b，型別錯誤會讓這一步失敗
      - name: 型別檢查＋建置
        run: npm run build

      - name: 建置 Demo 版
        run: npm run build:demo

  # 端對端測試：用真的瀏覽器跑登入、點餐出餐、叫貨等完整流程（對象是 Demo 版，不需要後端）
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安裝 Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
      # 失敗時上傳報告（含每一步的截圖與操作紀錄），在 Actions 頁面下載查看
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
